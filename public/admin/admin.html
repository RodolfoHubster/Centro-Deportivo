<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Centro Deportivo UABC</title>
  <link rel="stylesheet" href="../css/main.css?v=19">
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- CONTENIDO -->
  <main class="page-content">
    <h1>Bienvenido al Panel Administrativo</h1>
    <p id="mensaje-bienvenida">Cargando información...</p>

    <!-- AGREGAR ESTE BLOQUE PARA EL FILTRO DE PERIODO -->
    <div style="margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block;">
      <label for="filtroPeriodoDashboard" style="font-weight: bold; font-size: 14px; margin-right: 10px;">Mostrar estadísticas del periodo:</label>
      <select id="filtroPeriodoDashboard" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd; outline: none;">
        <option value="">Cargando periodos...</option>
      </select>
    </div>
    <!-- FIN DEL BLOQUE -->

    <div class="admin-stats-grid">

      <div class="admin-stat-card eventos">
        <h3>Total Eventos</h3>
        <p class="stat-number" id="total-eventos">-</p>
        <a href="gestionar-eventos.html" class="stat-link">Ver todos →</a>
      </div>

      <div class="admin-stat-card inscripciones">
        <h3>Inscripciones</h3>
        <p class="stat-number" id="total-inscripciones">-</p>
        <a href="ver-inscripciones.html" class="stat-link">Ver todos →</a>
      </div>

    </div>

    <div class="admin-quick-links">
      <h2>Accesos Rápidos</h2>
      <div class="admin-quick-links-container">
        <a href="gestionar-eventos.html" class="admin-quick-link-btn eventos">
          Crear Nuevo Evento
        </a>
        <a href="ver-inscripciones.html" class="admin-quick-link-btn inscripciones">
          Ver Inscripciones
        </a>
      </div>
    </div>
  </main>

  <script src="../js/headFooter.js?v=19"></script>
  <script src="../js/admin/adminDashboard.js"></script>

</body>
</html>
