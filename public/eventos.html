<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - Centro Deportivo UABC</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="page-content">

    <h1>Eventos Deportivos</h1>
    
    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
      <h3 style="margin-top: 0; color: #003366; font-size: 1.1rem; margin-bottom: 15px;">Filtra y encuentra tu evento:</h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
          
          <div>
              <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Buscar:</label>
              <input type="text" id="filtro-buscar-publico" placeholder="Nombre del evento o lugar..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
          </div>

          <div>
              <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Campus:</label>
              <select id="filtro-campus-publico" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
                  <option value="">Todos los Campus</option>
                  <option value="Mexicali">Mexicali</option>
                  <option value="Tijuana">Tijuana</option>
                  <option value="Ensenada">Ensenada</option>
              </select>
          </div>

          <div>
            <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Categoría:</label>
            <select id="filtro-categoria-publico" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
                <option value="">Cualquier Categoría</option>
                <option value="Carrera">Carrera</option>
                <option value="Rally">Rally</option>
                <option value="Activación Física">Activación Física</option>
                <option value="Paseo Ciclista">Paseo Ciclista</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

      </div>
      <button id="btnLimpiarFiltrosPublico" style="margin-top: 15px; padding: 8px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer;">Limpiar Filtros</button>
  </div>

  </div>
    <p>Aqui se mostraran los eventos deportivos programados en el Centro Deportivo UABC.</p>
    
    <div id="lista-eventos"></div>

  </main> 

  <div id="footer-placeholder"></div>

  <!-- ===== MODAL: Selección de Facultad (Pausa Activa) ===== -->
  <div id="modalFacultadesPausa" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
       background:rgba(0,0,0,0.65); z-index:99999; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">
    <div style="background:#fff; border-radius:14px; width:100%; max-width:520px; max-height:85vh;
                display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden;">
      
      <div style="padding:20px 25px 15px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
        <div>
          <h3 style="margin:0 0 4px; color:#003366; font-size:1.15rem;">Selecciona tu Facultad y Carrera</h3>
          <p style="margin:0; font-size:0.88rem; color:#666;">
            Registrándote como: <strong id="modalPausa-sexoLabel" style="font-size:0.95rem;">—</strong>
          </p>
        </div>
        <button class="btn-cerrar-modal-pausa" style="background:transparent; border:none; font-size:1.6rem; cursor:pointer; color:#999; line-height:1; padding:5px;">&times;</button>
      </div>

      <!-- Lista de facultades (scrollable) -->
      <div id="lista-facultades-pausa" style="padding:20px; overflow-y:auto; flex:1;">
        <p style="text-align:center; color:#999;">Cargando...</p>
      </div>

      <!-- Pie del modal -->
      <div style="padding:12px 20px; border-top:1px solid #e2e8f0; text-align:center; flex-shrink:0;">
        <button class="btn-cerrar-modal-pausa"
          style="padding:10px 30px; background:#6c757d; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:bold;">
          Cancelar
        </button>
      </div>
    </div>
  </div>
  <!-- ===== FIN MODAL PAUSA ACTIVA ===== -->

  <script src="js/headFooter.js"></script>
  <script src="js/user/Eventos.js"></script>
  <script src="js/user/Inscripcion.js" type="module"></script>
  <script src="js/user/InscripcionPausa.js"></script>

</body>
</html>
