<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - Centro Deportivo UABC</title>
  <link rel="stylesheet" href="css/main.css?v=7">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="page-content">

    <h1>Eventos Deportivos</h1>
    
    <div class="filtros-admin-container">
      <h3 style="margin-top: 0; color: #003366; font-size: 1.1rem; margin-bottom: 15px;">Filtra y encuentra tu evento:</h3>
      <div class="filtros-admin-grid">
          
          <div>
              <label>Buscar:</label>
              <input type="text" id="filtro-buscar-publico" placeholder="Nombre del evento o lugar...">
          </div>

          <div>
              <label>Campus:</label>
              <select id="filtro-campus-publico">
                  <option value="">Todos los Campus</option>
                  <option value="Mexicali">Mexicali</option>
                  <option value="Tijuana">Tijuana</option>
                  <option value="Ensenada">Ensenada</option>
              </select>
          </div>

          <div>
            <label>Categoría:</label>
            <select id="filtro-categoria-publico">
                <option value="">Cualquier Categoría</option>
                <option value="Carrera">Carrera</option>
                <option value="Rally">Rally</option>
                <option value="Activación Física">Activación Física</option>
                <option value="Paseo Ciclista">Paseo Ciclista</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

      </div>
      <button id="btnLimpiarFiltrosPublico" class="btn-limpiar-filtros">Limpiar Filtros</button>
  </div>

  </div>
    <p>Aqui se mostraran los eventos deportivos programados en el Centro Deportivo UABC.</p>
    
    <div id="lista-eventos"></div>

  </main> 

  <div id="footer-placeholder"></div>

  <script src="js/headFooter.js"></script>
  <script src="js/user/Eventos.js"></script>
  <script src="js/user/Inscripcion.js?v=2" type="module"></script>  

</body>
</html>
