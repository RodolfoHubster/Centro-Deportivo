<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneos - Centro Deportivo UABC</title>
  <link rel="stylesheet" href="css/main.css?v=33">
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="page-content">
    <h1>Torneos</h1>
    <p style="margin-bottom: 20px;">Consulta la lista de torneos disponibles, arma tu equipo y participa.</p>

    <div class="filtros-admin-container">
        <h3 style="margin-top: 0; color: var(--color-azul-uabc); font-size: 1.1rem; margin-bottom: 15px;">Filtra y encuentra tu torneo:</h3>
        <div class="filtros-admin-grid">
            
            <div>
                <label>Buscar:</label>
                <input type="text" id="filtro-buscar-publico" placeholder="Nombre del torneo o lugar...">
            </div>

            <div>
                <label>Campus:</label>
                <select id="filtro-campus-publico">
                    <option value="">Todos los Campus</option>
                    <option value="Mexicali">Mexicali</option>
                    <option value="Tijuana">Tijuana</option>
                    <option value="Ensenada">Ensenada</option>
                </select>
            </div>

            <div>
                <label>Deporte / Categoría:</label>
                <select id="filtro-categoria-publico">
                    <option value="">Cualquier Deporte</option>
                    <option value="Fútbol">Fútbol</option>
                    <option value="Fútbol Rápido">Fútbol Rápido</option>
                    <option value="Básquetbol">Básquetbol</option>
                    <option value="Voleibol">Voleibol</option>
                    <option value="Handball">Handball</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

          <div>
              <label>Cu&aacute;ndo:</label>
              <select id="filtro-cuando-publico">
                  <option value="">Cualquier fecha</option>
                  <option value="curso">En curso ahora</option>
                  <option value="7">Pr&oacute;ximos a comenzar (7 d&iacute;as)</option>
                  <option value="30">Este mes</option>
              </select>
          </div>

        </div>
        <button id="btnLimpiarFiltrosPublico" class="btn-limpiar-filtros">Limpiar Filtros</button>
    </div>
    <div id="lista-eventos" class="eventos-container"></div>

    <div class="pagination-controls">
      <div class="pagination-grupo">
        <label for="limiteRegistros">Mostrar:</label>
        <select id="limiteRegistros">
          <option value="6">6 torneos</option>
          <option value="12">12 torneos</option>
          <option value="24">24 torneos</option>
        </select>
      </div>
      <div class="pagination-grupo">
        <span id="infoPaginacion" class="pagination-info">Calculando...</span>
        <div class="pagination-botones">
          <button id="btnPrevPage" class="btn-paginacion" disabled>&lt; Anterior</button>
          <button id="btnNextPage" class="btn-paginacion">Siguiente &gt;</button>
        </div>
      </div>
    </div>

    </main>

  <script src="js/user/Eventos.js?v=33"></script>
  <script src="js/user/Inscripcion.js?v=33" type="module"></script>
  <div id="footer-placeholder"></div> 
  <script src="js/headFooter.js?v=33"></script>

  <!-- ===== MODAL: Selección de Facultad (Pausa Activa) ===== -->
  <div id="modalFacultadesPausa" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
       background:rgba(0,0,0,0.65); z-index:99999; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">
    <div style="background:#fff; border-radius:14px; width:100%; max-width:520px;
                /* Altura fija: antes era max-height y el modal crecia o encogia
                   con cada busqueda. Ahora el tamano no cambia y la lista hace
                   scroll por dentro. */
                height:min(85vh, 620px);
                display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden;">
      
      <div style="padding:20px 25px 15px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
        <div>
          <h3 style="margin:0 0 4px; color:var(--color-azul-uabc); font-size:1.15rem;">Selecciona tu Facultad y Carrera</h3>
          <p style="margin:0; font-size:0.88rem; color:#666;">
            Registrándote como: <strong id="modalPausa-sexoLabel" style="font-size:0.95rem;">—</strong>
          </p>
        </div>
        <button class="btn-cerrar-modal-pausa" style="background:transparent; border:none; font-size:1.6rem; cursor:pointer; color:#999; line-height:1; padding:5px;">&times;</button>
      </div>

      <!-- Buscador de carrera: filtra entre TODAS las carreras del evento,
           sin tener que ir facultad por facultad. -->
      <div style="padding:14px 25px; border-bottom:1px solid #e2e8f0; flex-shrink:0; background:#f8fafc;">
        <label for="buscarCarreraPausa" style="display:block; font-weight:700; font-size:0.85rem; color:var(--color-azul-uabc); margin-bottom:6px;">
          Busca tu carrera
        </label>
        <input type="search" id="buscarCarreraPausa" autocomplete="off"
               placeholder="Escribe parte del nombre. Ej. software, derecho..."
               style="width:100%; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:1rem;">
        <p id="buscarCarreraPausaInfo" style="margin:6px 0 0; font-size:0.8rem; color:#666;"></p>
      </div>

      <!-- Lista de facultades (scrollable) -->
      <div id="lista-facultades-pausa" style="padding:20px; overflow-y:auto; flex:1;">
        <p style="text-align:center; color:#999;">Cargando...</p>
      </div>

      <!-- Pie del modal -->
      <div style="padding:12px 20px; border-top:1px solid #e2e8f0; text-align:center; flex-shrink:0;">
        <button class="btn-cerrar-modal-pausa"
          style="padding:10px 30px; background:#6c757d; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:bold;">
          Cancelar
        </button>
      </div>
    </div>
  </div>
  <!-- ===== FIN MODAL PAUSA ACTIVA ===== -->

  <script src="js/user/InscripcionPausa.js?v=33"></script>

</body>
</html>
